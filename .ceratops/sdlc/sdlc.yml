version: 5
kind: ceratops-sdlc
repository:
  tools:
    uv:
      executable: uv
    windows:
      executable: powershell
      platforms: [windows]
    powershell-core:
      executable: pwsh
    inno-setup:
      executable: ISCC.exe
      version-from:
        file: dependencies.json
        key: InnoSetup
      platforms: [windows]
    github-cli:
      executable: gh
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      version-from:
        file: scripts/package.json
        key: engines.node
    npm:
      executable: npm
  actions:
    bootstrap:
      requires:
        tools: [uv, node, npm]
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        - run: [uv, run, --project, scripts, --locked, python, -c, "import shutil, subprocess, sys; tool = shutil.which(sys.argv[1]); sys.exit(subprocess.call([tool, *sys.argv[2:]]) if tool else f'{sys.argv[1]} is not on PATH')", npm, ci, --prefix, scripts]
    pre-build-checks:
      check-groups:
        npm-markdown-lint:
          requires:
            tools: [node, npm]
          validation-tools: [npm-markdown-lint]
          check-results:
            result-owner: operation
            product-inputs: ['**/*.md']
            check-inputs: [.ceratops/sdlc/sdlc.yml, scripts/package.json, scripts/.markdownlint.json]
            dependencies: [scripts/package-lock.json]
            tools: [node, npm]
          steps:
            - run: [npm, --prefix, scripts, run, lint:markdown]
        ruff:
          requires:
            tools: [uv, python]
          validation-tools: [ruff]
          check-results:
            result-owner: operation
            product-inputs: ['**/*.py', '**/*.pyi', '**/*.ipynb']
            check-inputs: [.ceratops/sdlc/sdlc.yml, scripts/pyproject.toml, .gitignore, '**/.gitignore']
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, ruff, check, ., --config, scripts/pyproject.toml]
        mypy:
          requires:
            tools: [uv, python]
          validation-tools: [mypy]
          check-results:
            result-owner: operation
            product-inputs: ['**/*.py', '**/*.pyi', '**/*.ipynb']
            check-inputs: [.ceratops/sdlc/sdlc.yml, scripts/pyproject.toml, .gitignore, '**/.gitignore']
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE, MYPYPATH]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, mypy, --config-file, scripts/pyproject.toml]
        actionlint:
          requires:
            tools: [uv, python]
          validation-tools: [actionlint]
          check-results:
            result-owner: operation
            product-inputs: [.github/workflows/*.yml, .github/workflows/*.yaml, .github/actions/**]
            check-inputs: [.ceratops/sdlc/sdlc.yml, scripts/pyproject.toml, scripts/run-actionlint.py, .github/actionlint.yaml,
                  .github/actionlint.yml]
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE, GITHUB_EVENT_NAME, GITHUB_EVENT_PATH,
                  GITHUB_ACTIONS]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-actionlint.py]
        tests:
          requires:
            tools: [uv, powershell-core]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-tests.py]
deliverables:
  packages:
    ceratops-keyboard-layout-installer:
      version: {mode: receipt-only}
      root-dir: .
      build-after: []
      artifact:
        type: windows-installer
        # Standalone output. The build action below uses its allocated artifact_directory.
        output-directory: .
        filename-pattern: CeratopsKeyboardLayout-Setup-*.exe
      actions:
        pre-build-checks:
          check-groups:
            tests:
              requires:
                tools: [uv]
              steps:
                - run: [uv, run, --project, scripts, --locked, python, scripts/run-tests.py, --suite, installer]
        build:
          parameters: [artifact_directory]
          result-schema: ceratops-builder-output
          requires:
            tools: [uv, windows, inno-setup]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, build, --artifact-directory, '{artifact_directory}', --receipt-file, '{build_receipt}']
        publish:
          requires:
            tools: [uv, windows, github-cli]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, publish, --accepted-artifacts, '{artifacts}']
  apps:
    ceratops-keyboard-layout:
      version:
        read:
          - "{python}"
          - "-c"
          - |
              import pathlib,re,sys
              p=pathlib.Path(sys.argv[1])
              matches=list(re.finditer(sys.argv[2],p.read_bytes().decode('utf-8'),re.M))
              if len(matches)!=1: raise ValueError('Expected one native version declaration')
              print(matches[0][1])
          - "CeratopsKeyboardLayout-Setup.iss"
          - "^#define AppVersion \"([^\"\\r\\n]+)\"\\r?$"
        write:
          - "{python}"
          - "-c"
          - |
              import os,pathlib,re,sys
              p=pathlib.Path(sys.argv[1]); text=p.read_bytes().decode('utf-8')
              matches=list(re.finditer(sys.argv[2],text,re.M))
              if len(matches)!=1: raise ValueError('Expected one native version declaration')
              version=sys.argv[4]
              if not re.fullmatch(sys.argv[3],version): raise ValueError('Version does not match the native format')
              temporary=p.with_name('.'+p.name+'.in_process')
              temporary.unlink(missing_ok=True)
              if matches[0][1]!=version:
                  start,end=matches[0].span(1)
                  with temporary.open('xb') as stream:
                      stream.write((text[:start]+version+text[end:]).encode('utf-8')); stream.flush(); os.fsync(stream.fileno())
                  os.replace(temporary,p)
          - "CeratopsKeyboardLayout-Setup.iss"
          - "^#define AppVersion \"([^\"\\r\\n]+)\"\\r?$"
          - "[0-9]+(?:\\.[0-9]+){2}"
          - "{version}"
        files:
          - "CeratopsKeyboardLayout-Setup.iss"
      root-dir: .
      manifest: CeratopsKeyboardLayout-Setup.iss
      build-after:
        - deliverables.packages.ceratops-keyboard-layout-installer
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                tools: []
              no-op: Repository validation runs separately; no app-only validation is declared.
            tests:
              requires:
                tools: []
              no-op: Repository tests run separately; the desktop hotkey check runs locally before release.
        install:
          requires:
            tools: [uv, windows]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, install, --accepted-artifacts, '{artifacts}']
