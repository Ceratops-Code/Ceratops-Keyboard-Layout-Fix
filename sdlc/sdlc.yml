version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    windows:
      executable: powershell
      platforms: [windows]
    inno-setup:
      executable: ISCC.exe
      version: 6.7.3
      platforms: [windows]
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/validate-repository.py
    test:
      requires:
        capabilities: [uv, windows]
      steps:
        - run: [uv, run, --project, scripts, --locked, python, -c, "import os, sys; sys.exit('Desktop tests require a signed-in Windows session, not CI.' if os.getenv('CI') else 0)"]
        - run: [uv, run, --project, scripts, --locked, python, -c, "import os, subprocess, sys; sys.exit(subprocess.call([os.path.abspath('CeratopsKeyboardLayout.exe'), '/ErrorStdOut=UTF-8', 'Tests/Test-KeyConversion.ahk']))"]
        - run: [uv, run, --project, scripts, --locked, python, -c, "import os, subprocess, sys; sys.exit(subprocess.call([os.path.abspath('CeratopsKeyboardLayout.exe'), '/ErrorStdOut=UTF-8', 'Tests/Test-AccessibleConversion.ahk']))"]

deliverables:
  packages:
    ceratops-keyboard-layout-installer:
      source: .
      prerequisites: []
      artifact:
        type: windows-installer
        output-directory: .
        filename-pattern: CeratopsKeyboardLayout-Setup.exe
      actions:
        build:
          requires:
            capabilities: [windows, inno-setup]
          steps:
            - run: [ISCC.exe, /Q, CeratopsKeyboardLayout-Setup.iss]
  apps:
    ceratops-keyboard-layout:
      source: .
      manifest: CeratopsKeyboardLayout-Setup.iss
      prerequisites: [ceratops-keyboard-layout-installer]
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation runs separately; no app-only validation is declared.
        test:
          requires:
            capabilities: []
          no-op: Repository tests run separately; the desktop hotkey check runs locally before release.
        install:
          requires:
            capabilities: [uv, windows]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -c
                - "import os, subprocess, sys; sys.exit(subprocess.call([os.path.abspath('CeratopsKeyboardLayout-Setup.exe'), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-']))"
