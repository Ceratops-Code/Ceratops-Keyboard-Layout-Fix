version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    windows:
      executable: powershell
      platforms:
        - windows
    powershell-core:
      executable: pwsh
    inno-setup:
      executable: ISCC.exe
      version-from:
        file: dependencies.json
        key: InnoSetup
      platforms:
        - windows
    github-cli:
      executable: gh
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - uv
          - powershell-core
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/run-tests.py
deliverables:
  packages:
    ceratops-keyboard-layout-installer:
      source: .
      prerequisites: []
      artifact:
        type: windows-installer
        output-directory: .
        filename-pattern: CeratopsKeyboardLayout-Setup-*.exe
      actions:
        test:
          requires:
            capabilities:
              - uv
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
                - --suite
                - installer
        build:
          requires:
            capabilities:
              - uv
              - windows
              - inno-setup
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/release-installer.py
                - build
        publish:
          requires:
            capabilities:
              - uv
              - windows
              - inno-setup
              - github-cli
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/release-installer.py
                - publish
  apps:
    ceratops-keyboard-layout:
      source: .
      manifest: CeratopsKeyboardLayout-Setup.iss
      prerequisites:
        - ceratops-keyboard-layout-installer
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation runs separately; no app-only validation is
            declared.
        test:
          requires:
            capabilities: []
          no-op: Repository tests run separately; the desktop hotkey check runs locally
            before release.
        install:
          requires:
            capabilities:
              - uv
              - windows
              - inno-setup
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/release-installer.py
                - install
