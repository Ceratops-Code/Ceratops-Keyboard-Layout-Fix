version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    windows:
      executable: powershell
      platforms: [windows]
    inno-setup:
      executable: ISCC.exe
      version-from:
        file: dependencies.json
        key: InnoSetup
      platforms: [windows]
    github-cli:
      executable: gh
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/validate-repository.py
    test:
      requires:
        capabilities: [uv, windows]
      steps:
        - run: [uv, run, --project, scripts, --locked, python, -c, "import os, sys; sys.exit('Desktop tests require a signed-in Windows session, not CI.' if os.getenv('CI') else 0)"]
        - run: [./CeratopsKeyboardLayout.exe, /ErrorStdOut=UTF-8, Tests/Test-KeyConversion.ahk]
        - run: [./CeratopsKeyboardLayout.exe, /ErrorStdOut=UTF-8, Tests/Test-AccessibleConversion.ahk]

deliverables:
  packages:
    ceratops-keyboard-layout-installer:
      source: .
      prerequisites: []
      artifact:
        type: windows-installer
        output-directory: .
        filename-pattern: CeratopsKeyboardLayout-Setup.exe
      actions:
        test:
          requires:
            capabilities: [uv]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, Tests/test_installer_release.py]
        build:
          requires:
            capabilities: [uv, windows, inno-setup]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, build]
        publish:
          requires:
            capabilities: [uv, windows, inno-setup, github-cli]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, publish]
  apps:
    ceratops-keyboard-layout:
      source: .
      manifest: CeratopsKeyboardLayout-Setup.iss
      prerequisites: [ceratops-keyboard-layout-installer]
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation runs separately; no app-only validation is declared.
        test:
          requires:
            capabilities: []
          no-op: Repository tests run separately; the desktop hotkey check runs locally before release.
        install:
          requires:
            capabilities: [uv, windows]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/release-installer.py, install]
